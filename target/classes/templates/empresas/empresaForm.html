<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h3 class="mb-0" th:text="${empresa.id != 0} ? 'Editar Empresa' : 'Registrar Nueva Empresa'"></h3>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/empresas/guardar}" th:object="${empresa}" method="post" class="needs-validation" novalidate>
                            
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre de la Empresa</label>
                                <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Sj Proline S.L." required>
                                <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Nombre del Tutor</label>
                                    <input type="text" th:field="*{nombre_tutor}" class="form-control" placeholder="Nombre completo" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Email del Tutor</label>
                                    <input type="email" th:field="*{email_tutor}" class="form-control" placeholder="email@empresa.com" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Descripción / Actividad</label>
                                <textarea th:field="*{descripcion}" class="form-control" rows="3" placeholder="Breve descripción de la empresa..."></textarea>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/empresas}" class="btn btn-outline-secondary px-4">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary px-5">
                                    <i class="bi bi-save"></i> Guardar Empresa
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
