<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Asignación de Práctica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-success text-white py-3">
                        <h3 class="mb-0 text-center"><i class="bi bi-file-earmark-text"></i> Nueva Asignación de Prácticas</h3>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/practicas/guardar}" th:object="${practica}" method="post">
                            
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label fw-bold">Alumno</label>
                                <select th:field="*{alumno}" class="form-select" required>
                                    <option value="">Seleccione un alumno...</option>
                                    <option th:each="al : ${listaAlumnos}" 
                                            th:value="${al.id}" 
                                            th:text="${al.nombre} + ' ' + ${al.apellido1}  + ' ' + ${al.apellido2}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Empresa Destino</label>
                                <select th:field="*{empresa}" class="form-select" required>
                                    <option value="">Seleccione una empresa...</option>
                                    <option th:each="em : ${listaEmpresas}" 
                                            th:value="${em.id}" 
                                            th:text="${em.nombre}"></option>
                                </select>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Fecha Inicio</label>
                                    <input type="date" th:field="*{fechaInicio}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Fecha Fin</label>
                                    <input type="date" th:field="*{fechaFin}" class="form-control" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Comentarios</label>
                                <textarea th:field="*{comentarios}" class="form-control" rows="3" placeholder="Observaciones sobre la práctica..."></textarea>
                            </div>

                            <div class="d-flex justify-content-between pt-3">
                                <a th:href="@{/practicas}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">
                                    <i class="bi bi-save"></i> Guardar Práctica
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
