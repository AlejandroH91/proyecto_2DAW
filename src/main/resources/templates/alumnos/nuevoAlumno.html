<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3><i class="bi bi-person-plus"></i> Registrar Nuevo Alumno</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/Alumnos/guardar}" th:object="${alumno}" method="post">
                    
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Primer Apellido</label>
                            <input type="text" th:field="*{apellido1}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Segundo Apellido</label>
                            <input type="text" th:field="*{apellido2}" class="form-control">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Fecha de Nacimiento</label>
                        <input type="date" th:field="*{fecha_nacimiento}" class="form-control" required>
                    </div>

                    <div class="mb-3" th:if="${listaCursos != null}">
                        <label class="form-label">Curso</label>
                        <select th:field="*{curso}" class="form-select">
                            <option th:each="c : ${listaCursos}" th:value="${c.id}" th:text="${c.nombre}"></option>
                        </select>
                    </div>

                    <input type="hidden" th:if="${listaCursos == null}" th:field="*{curso.id}" />

                    <div class="mt-4">
                        <button type="submit" class="btn btn-success">Guardar Alumno</button>
                        <a th:href="@{/Clases}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
