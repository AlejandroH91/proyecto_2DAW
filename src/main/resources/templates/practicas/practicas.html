<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Listado de Prácticas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
	<!-- BARRA DE NAVEGACIÓN-->

	<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm fixed-top mb-5">
		<div class="container-fluid">
			<a class="navbar-brand fw-bold" href="#">Gestión DAW</a>

			<!-- Menú hamburguesa -->
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<!-- Enlaces del menú -->
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item">
						<a class="nav-link active" aria-current="page" th:href="@{/profesores}">
							Profesores
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" th:href="@{/practicas}">
							Prácticas
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" th:href="@{/Clases}">
							Cursos
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" th:href="@{/empresas}">
							Empresas
						</a>
					</li>
				</ul>
				<ul class="navbar-nav ms-auto">
					<li class="nav-item">
						<a class="nav-link text-white" th:href="@{/login}">
							<i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
						</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>
	
	<!-- Tabla de prácticas-->
	<div class="container mt-5 mb-5">
		<div class="card shadow-lg p-4">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h1 class="text-success"> Listado de Practicas</h1>
				<a th:href="@{/practicas/nueva}" class="btn btn-success">
					 Asignar Práctica
				</a>
			</div>

			<div class="table-responsive">
				<table id="tablaPracticas" class="table table-hover table-bordered">
					<thead class="table-dark">
						<tr>
							<th>Alumno</th>
							<th>Empresa</th>
							<th>Fecha Inicio</th>
							<th>Fecha Fin</th>
							<th>Tutor Laboral</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="p : ${listaPracticas}">
							<td class="fw-bold" th:text="${p.alumno.nombre} + ' ' + ${p.alumno.apellido1} + ' ' + ${p.alumno.apellido2}"></td>
							<td th:text="${p.empresa.nombre}"></td>

							<td th:text="${p.fechaInicioFormateada}"></td>
							<td th:text="${p.fechaFinFormateada}"></td>

							<td th:text="${p.empresa.nombre_tutor}"></td>
							<td>
								<a th:href="@{/practicas/eliminar(id=${p.id})}" class="btn btn-danger btn-sm"
									onclick="return confirm('¿Deseas cancelar esta asignación?')">
									<i class="bi bi-trash"></i>
								</a>
								<a th:href="@{/practicas/editar/{id}(id=${p.id})}" class="btn btn-warning btn-sm">
								    <i class="bi bi-pencil-square"></i>
								</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

	<script>
		$(document).ready(function () {
			$('#tablaPracticas').DataTable({
				"language": {
					"url": "//cdn.datatables.net/plug-ins/1.13.7/i18n/es-ES.json"
				}
			});
		});
	</script>
</body>

</html>
