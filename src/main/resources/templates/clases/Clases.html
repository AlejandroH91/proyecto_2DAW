<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ver Clases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
	
	<!-- BARRA DE NAVEGACIÓN-->
		<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm fixed-top mb-5">
		        <div class="container-fluid">
		            <a class="navbar-brand fw-bold" href="#">Gestión DAW</a>
		            
		            <!-- Botón toggle para móvil -->
		            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
		                    data-bs-target="#navbarNav" aria-controls="navbarNav" 
		                    aria-expanded="false" aria-label="Toggle navigation">
		                <span class="navbar-toggler-icon"></span>
		            </button>
		            
		            <!-- Enlaces del menú -->
		            <div class="collapse navbar-collapse" id="navbarNav">
		                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
		                    <li class="nav-item">
		                        <a class="nav-link active" aria-current="page" 
		                           th:href="@{/profesores}">
		                            Profesores
		                        </a>
		                    </li>
		                    <li class="nav-item">
		                        <a class="nav-link" th:href="@{/practicas}">
		                            Prácticas
		                        </a>
		                    </li>
		                    <li class="nav-item">
		                        <a class="nav-link" th:href="@{/Clases}">
		                            Cursos
		                        </a>
		                    </li>
		                    <li class="nav-item">
		                        <a class="nav-link" th:href="@{/empresas}">
		                            Empresas
		                        </a>
		                    </li>
		                </ul>
		                <ul class="navbar-nav ms-auto">
		                    <li class="nav-item">
		                        <a class="nav-link text-white" th:href="@{/login}">
		                            <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
		                        </a>
		                    </li>
		                </ul>
		            </div>
		        </div>
		    </nav>
			
    <div class="container mt-5 mb-5">
        <div class="card shadow-lg p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="text-primary" th:text="#{app.titulo}">Ver Clases</h1>
					
                <a th:href="@{/Clases/nuevo}" class="btn btn-success">
                    <i class="bi bi-plus-circle" th:text="#{btn.nuevoCurso}"></i> 
                </a>
				<a th:href="@{/Alumnos/nuevo}" class="btn btn-primary">
				    <i class="bi bi-person-plus" th:text="#{btn.nuevoAlumno}"></i> 
				</a>
				
            </div>

            <div class="card border-primary mb-4">
                <div class="card-body">
					
                    <h5 class="card-title text-primary">
						<i class="bi bi-file-earmark-arrow-up" th:text="#{btn.cargaAlumno}"></i></h5>
                    <form th:action="@{/Clases/importar}" method="post" enctype="multipart/form-data" class="row g-3 mt-1">
						
                        <div class="col-auto">
							
                            <input type="file" name="archivo" class="form-control" accept=".csv" required>
							
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-upload" th:text="#{btn.subirArchivo}"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="row mb-3 align-items-end">
				<div class="row align-items-end mb-4">
				    <div class="col-md-5">
				        <label class="form-label fw-bold" th:text="#{select.Curso}">
				            <i class="bi bi-funnel"></i> 
				        </label>
				        <select id="filtroCurso" class="form-select border-info" 
				                onchange="window.location.href='/Clases?cursoId=' + this.value">
				            <option value="">-- Seleccione un curso --</option>
				            <option th:each="c : ${todosLosCursos}" 
				                    th:value="${c.id}" 
				                    th:text="${c.nombre}"
				                    th:selected="${c.id == cursoSeleccionado}"></option>
				        </select>
				    </div>

				    <div class="col-md-7 text-end">
				        <div th:if="${cursoSeleccionado != null}" class="p-2 bg-white border rounded shadow-sm d-inline-block">
				            <span class="text-muted small">Profesor:</span>
				            <strong class="text-primary fs-5 ms-2" 
				                    th:each="c : ${todosLosCursos}" 
				                    th:if="${c.id == cursoSeleccionado}"
				                    th:text="${c.profesor != null ? c.profesor.nombre + ' ' + c.profesor.apellido1 : 'Sin profesor asignado'}">
				                Nombre del Profesor
				            </strong>
				        </div>
				    </div>
				</div>
            </div>

            <div class="table-responsive" th:if="${not #lists.isEmpty(todosLosAlumnos)}">
                <table id="tablaAlumnos" class="table table-hover table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th th:text="#{cuso.Seleccionado}"></th>
                            <th>Email</th>
                            <th th:text="#{cuso}"></th>
                            <th th:text="#{Acciones}"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="al : ${todosLosAlumnos}">
                            <td th:text="${(al.nombre != null ? al.nombre : '') + ' ' + (al.apellido1 != null ? al.apellido1 : '')
							+ ' ' + (al.apellido2 != null ? al.apellido2 : '')}"></td>
                            <td th:text="${al.email}"></td>
                            <td>
                                <span class="badge bg-info text-dark" 
                                      th:if="${al.curso != null}" 
                                      th:text="${al.curso.nombre}"></span>
                            </td>
                            <td>
                                <a th:href="@{/Alumnos/editar(id=${al.id})}" class="btn btn-warning btn-sm">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/Alumnos/eliminar(id=${al.id})}" class="btn btn-danger btn-sm"
                                   onclick="return confirm('¿Borrar este alumno?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div th:if="${#lists.isEmpty(todosLosAlumnos)}" class="alert alert-light border text-center py-4">
                <i class="bi bi-info-circle fs-4 text-info" th:text="#{condicional}"></i><br>
                
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a th:href="@{/profesores}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left" th:text="#{btn.Volver}"></i> 
                </a>
                <button type="button" id="btnEliminarCurso" class="btn btn-danger">
                    <i class="bi bi-trash-fill" th:text="#{btn.EliminarCurso}"></i> 
                </button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

    <script>
        $(document).ready(function() {
            if ($('#tablaAlumnos').length) {
                $('#tablaAlumnos').DataTable({
                    "language": {
                        "url": "//cdn.datatables.net/plug-ins/1.13.7/i18n/es-ES.json"
                    },
                    "dom": 'rtip',
                    "pageLength": 10
                });
            }

            // Lógica para el botón de eliminar curso
            $('#btnEliminarCurso').on('click', function() {
                let idCurso = $('#filtroCurso').val();
                if (!idCurso) {
                    alert("Por favor, selecciona primero un curso en el desplegable superior.");
                    return;
                }
                if (confirm("¿Estás seguro de que deseas eliminar este curso? (Solo se eliminará si no tiene alumnos)")) {
                    window.location.href = "/Clases/eliminarCurso?id=" + idCurso;
                }
            });
        });
    </script>
</body>
</html>
